<!DOCTYPE html>
<html>

<head>
    <title>Dual Chat Demo</title>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            height: 100%;
            display: flex;
            flex-direction: column;
            font-family: sans-serif;
        }

        .pane {
            flex: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            border-right: 2px solid #ccc;
        }

        .pane:last-child {
            border-right: none;
        }

        .header {
            padding: 8px;
            background: #333;
            color: white;
            text-align: center;
            font-size: 0.9em;
        }

        iframe {
            flex: 1;
            border: none;
            width: 100%;
        }
    </style>
</head>

<body>
    <!-- Use ws:// to avoid certificate errors mixed with http:// -->
    <div class="pane">
        <div class="header">SnowWhite (localhost)</div>
        <iframe src="/?username=snowwhite&password=snowwhite"></iframe>
    </div>
    <div class="pane">
        <div class="header">Sleepy (localhost)</div>
        <iframe src="/?username=sleepy&password=sleepy"></iframe>
    </div>
</body>

</html>
