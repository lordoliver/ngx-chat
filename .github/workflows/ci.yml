name: CI

on:
  push:
    branches: [ master, main, fix/*, feat/* ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Start Test Environment
        run: |
          docker compose -f docker/test-env/docker-compose.yml up -d
          # Wait for services to be healthy/ready
          sleep 15
          docker compose -f docker/test-env/docker-compose.yml ps

      - name: Configure Hosts
        run: echo "127.0.0.1 local-jabber.entenhausen.pazz.de" | sudo tee -a /etc/hosts

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Cache Playwright Browsers
        uses: actions/cache@v3
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run E2E Tests
        run: npx nx e2e ngx-chat-e2e-new
        env:
          CI: true

      - name: Stop Test Environment
        if: always()
        run: |
          cd docker/test-env
          docker compose down --volumes
